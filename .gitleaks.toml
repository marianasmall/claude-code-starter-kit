title = "claude-code-starter-kit — suppress gitignored-path noise"

[extend]
useDefault = true

[allowlist]
description = "Local-only paths from .gitignore — never committed to repo"
# Patterns match both absolute (--no-git) and relative (git-history) paths. No leading anchor.
paths = [
    '''/\.env$''',
    '''/\.env\.''',
    '''\.local$''',
    '''/state/''',
    '''/_backups/''',
    # Root session-state file only (gitignored, never tracked). The earlier
    # unanchored /handoff\.md$ also exempted commands/handoff.md — the plugin's
    # own /handoff command — from every scan (check-gitleaks-allowlists.py, 2026-09-15).
    '''claude-code-starter-kit/handoff\.md$''',
]
